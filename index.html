<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi Online</title><style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#173b70;color:#fff;padding:15px;display:flex;justify-content:space-between}.wrap{padding:15px;max-width:1500px;margin:auto}.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 12px #0001}.login{max-width:400px;margin:10vh auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea,button{padding:9px;border-radius:7px;border:1px solid #ccd5e3;font:inherit}button{cursor:pointer}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.hidden{display:none!important}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;min-width:1050px;width:100%}th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:12px}th{background:#eef3fa;position:sticky;top:0}.name{text-align:left;position:sticky;left:0;background:white;z-index:1;min-width:180px}.badge{padding:4px 7px;border-radius:6px;font-weight:bold}.IN{background:#dcfce7}.OFF{background:#fee2e2}.Ijin{background:#fef3c7}.Cuti{background:#dbeafe}.Sakit{background:#f3e8ff}.req{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px}</style></head><body>
<section id="login" class="card login"><h2>📅 Absensi Online</h2><input id="email" type="email" placeholder="Email" style="width:100%;margin:5px 0"><input id="password" type="password" placeholder="Password" style="width:100%;margin:5px 0 12px"><button class="blue" style="width:100%" id="loginBtn">Masuk</button><p id="msg"></p></section>
<div id="app" class="hidden"><header><b>📅 Schedule & Absensi</b><span id="who"></span> <button id="logout">Keluar</button></header><main class="wrap"><div class="card toolbar"><label>Bulan <select id="month"></select></label><label>Tahun <input id="year" value="2026" type="number" style="width:90px"></label><input id="search" placeholder="Cari karyawan"></div><div id="adminPanel" class="hidden card"><h3>Request Karyawan</h3><div id="requests"></div></div><div class="card" id="notice"></div><div class="card"><div class="scroll"><table id="schedule"></table></div></div></main></div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:9999"><div class="card" style="width:380px"><h3>Ajukan Request</h3><p id="reqDate"></p><select id="reqType" style="width:100%"><option>OFF</option><option>Ijin</option><option>Cuti</option><option>Sakit</option></select><textarea id="reason" placeholder="Alasan" style="width:100%;height:80px;margin-top:8px"></textarea><br><br><button id="cancel">Batal</button> <button class="blue" id="send">Kirim</button></div></div>
<script type="module" src="app.js"></script></body></html>
